<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enchanter - タスク管理</title>
  <!-- 読み込み順 = カスケード順。responsive.cssは全タブを上書きするので最後 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/todo.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/report.css">
  <link rel="stylesheet" href="css/manage.css">
  <link rel="stylesheet" href="css/compare.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div class="brand-copy">
        <h1>Enchanter</h1>
        <span class="brand-tagline">タスクと時間を整える</span>
      </div>
    </div>
    <div id="running-box" class="running-box"></div>
    <nav class="tabs" aria-label="メインナビゲーション">
      <button type="button" class="tab-btn" data-action="tab" data-tab="todo" aria-current="page"><span class="tab-icon" aria-hidden="true">✓</span>Todo</button>
      <button type="button" class="tab-btn" data-action="tab" data-tab="kanban"><span class="tab-icon" aria-hidden="true">▦</span>カンバン</button>
      <button type="button" class="tab-btn" data-action="tab" data-tab="timeline"><span class="tab-icon" aria-hidden="true">◷</span>タイムライン</button>
      <button type="button" class="tab-btn" data-action="tab" data-tab="gantt"><span class="tab-icon" aria-hidden="true">≋</span>ガント</button>
      <button type="button" class="tab-btn" data-action="tab" data-tab="report"><span class="tab-icon" aria-hidden="true">◔</span>集計</button>
      <button type="button" class="tab-btn" data-action="tab" data-tab="manage"><span class="tab-icon" aria-hidden="true">⚙</span>管理</button>
    </nav>
  </header>
  <main id="view" class="view"></main>
  <!-- 画像候補の比較ボード(全画面)。ui.compareTaskIdがある間だけ中身を描画する -->
  <div id="compare-root"></div>
  <!-- 通常のscriptなのでトップレベルの宣言は全ファイルで共有される。読み込み時に他ファイルの関数を呼ぶ処理は、その定義より後に置くこと(render-app.jsはタブより後、main.jsが最後) -->
  <script src="js/constants.js"></script>
  <script src="js/time.js"></script>
  <script src="js/state.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/mutations.js"></script>
  <script src="js/image-compare.js"></script>
  <script src="js/render-common.js"></script>
  <script src="js/tab-todo.js"></script>
  <script src="js/tab-kanban.js"></script>
  <script src="js/tab-timeline.js"></script>
  <script src="js/tab-gantt.js"></script>
  <script src="js/export.js"></script>
  <script src="js/tab-report.js"></script>
  <script src="js/tab-manage.js"></script>
  <script src="js/view-compare.js"></script>
  <script src="js/render-app.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
